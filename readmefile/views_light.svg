<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: "SF Mono", "Fira Code", Monaco, Consolas, monospace; }
      
      @keyframes pulseRing {
        0% { r: 4; opacity: 1; }
        100% { r: 14; opacity: 0; }
      }
      .pulse-ring {
        animation: pulseRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <clipPath id="digitClip">
      <rect x="0" y="0" width="220" height="36" rx="6" />
    </clipPath>
  </defs>

  <!-- Background container -->
  <rect width="700" height="130" rx="16" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Live radar dot -->
  <g transform="translate(35, 38)">
    <circle cx="0" cy="0" r="10" fill="#059669" opacity="0.2" class="pulse-ring" />
    <circle cx="0" cy="0" r="5" fill="#059669" />
  </g>

  <!-- Title & Subtitle -->
  <text x="55" y="42" fill="#0F172A" font-size="16" font-weight="700" class="font-sans">LIVE PROFILE TRAFFIC &amp; VISITOR METRICS</text>
  <text x="55" y="65" fill="#475569" font-size="13" class="font-sans">Real-time visitor telemetry &amp; profile impressions</text>

  <!-- Interactive Rolling Counter Box -->
  <g transform="translate(480, 28)">
    <!-- Counter Badge Background -->
    <rect width="185" height="48" rx="10" fill="#F1F5F9" stroke="rgba(5, 150, 105, 0.25)" stroke-width="1" />
    
    <!-- "TOTAL VIEWS" small label -->
    <text x="12" y="16" fill="#64748B" font-size="9" font-weight="700" letter-spacing="0.5" class="font-mono">PROFILE VIEWS</text>
    
    <!-- Animated rolling digits container -->
    <g transform="translate(12, 22)" clip-path="url(#digitClip)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-30; 0,-60; 0,-90; 0,-120; 0,-150; 0,-180; 0,-210; 0,-240; 0,-270; 0,-300; 0,-330; 0,-360; 0,-390; 0,-420; 0,-450; 0,-480; 0,-510; 0,-540; 0,-570; 0,-600; 0,-630" dur="2.5s" fill="freeze" calcMode="spline" keyTimes="0; 0.05; 0.1; 0.15; 0.2; 0.25; 0.3; 0.35; 0.4; 0.45; 0.5; 0.55; 0.6; 0.65; 0.7; 0.75; 0.8; 0.85; 0.9; 0.95; 0.98; 1" keySplines="0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1" />
        <text x="0" y="20" fill="url(#numGrad)" font-size="20" font-weight="800" class="font-mono">
          <tspan x="0" dy="0">00000</tspan>
          <tspan x="0" dy="30">00018</tspan>
          <tspan x="0" dy="30">00054</tspan>
          <tspan x="0" dy="30">00129</tspan>
          <tspan x="0" dy="30">00287</tspan>
          <tspan x="0" dy="30">00451</tspan>
          <tspan x="0" dy="30">00698</tspan>
          <tspan x="0" dy="30">00924</tspan>
          <tspan x="0" dy="30">01240</tspan>
          <tspan x="0" dy="30">01582</tspan>
          <tspan x="0" dy="30">01890</tspan>
          <tspan x="0" dy="30">02150</tspan>
          <tspan x="0" dy="30">02480</tspan>
          <tspan x="0" dy="30">02790</tspan>
          <tspan x="0" dy="30">03120</tspan>
          <tspan x="0" dy="30">03380</tspan>
          <tspan x="0" dy="30">03590</tspan>
          <tspan x="0" dy="30">03740</tspan>
          <tspan x="0" dy="30">03820</tspan>
          <tspan x="0" dy="30">03875</tspan>
          <tspan x="0" dy="30">03890</tspan>
          <tspan x="0" dy="30">03892+</tspan>
        </text>
      </g>
    </g>
    
    <!-- Live ping icon -->
    <circle cx="165" cy="24" r="3" fill="#059669">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Bottom status bar -->
  <line x1="30" y1="92" x2="670" y2="92" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" />
  
  <g transform="translate(35, 112)">
    <text x="0" y="0" fill="#059669" font-size="12" font-weight="600" class="font-mono">● LIVE</text>
    <text x="60" y="0" fill="#475569" font-size="12" class="font-sans">Status: <tspan fill="#0F172A">Active Monitoring</tspan></text>
    <text x="240" y="0" fill="#475569" font-size="12" class="font-sans">Telemetry: <tspan fill="#0F766E">GitHub Camo Encrypted</tspan></text>
    <text x="480" y="0" fill="#0284C7" font-size="12" font-weight="600" class="font-sans">Traffic Insights &amp; Analytics ↗</text>
  </g>
</svg>
